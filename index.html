<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Pronunciation Lab</title>
<style>
body{margin:0;background:#f4f6fa;color:#1d2939;font-family:system-ui,"Noto Sans TC",sans-serif}header{background:#1c3558;color:white;padding:22px max(18px,calc((100% - 1050px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}main{max-width:1050px;margin:26px auto;padding:0 16px}.card{background:white;border:1px solid #e2e7ef;border-radius:15px;padding:22px;margin-bottom:16px}h1{font-size:24px}h2{font-size:19px}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}input,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d4dce8;border-radius:8px;font:inherit}textarea{min-height:90px}button{background:#3268d8;color:white;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;margin:5px 4px 5px 0}button.alt{background:#e9eef6;color:#344054}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.hidden{display:none}.sentence{font-size:26px;font-weight:750;background:#f1f5ff;padding:18px;border-radius:10px;line-height:1.5}.stats{display:flex;gap:20px;flex-wrap:wrap}.words{display:flex;gap:7px;flex-wrap:wrap}.word{padding:5px 8px;border-radius:6px;background:#edf2f8}.good{background:#d9f5e5;color:#11633f}.bad{background:#ffe1e3;color:#a52b37}.missed{background:#fff0d6;color:#8a5109}.muted{color:#667085;font-size:13px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:8px;border-bottom:1px solid #e4e9f0;text-align:left}@media(max-width:650px){.grid{grid-template-columns:1fr}header{display:block}.sentence{font-size:21px}}
</style></head><body><header><div><b>English Pronunciation Lab</b><div class="muted" style="color:#dce7f8">英文句子發音練習與學習紀錄</div></div><div><button class="alt" id="studentTab">學生練習</button><button class="alt" id="teacherTab">教師管理</button></div></header><main>
<section id="student"><div class="card"><h1>開始練習</h1><p class="muted">輸入班級、學號與姓名，每回合隨機練習 5 句。</p><div class="grid"><div><label>班級</label><input id="cls" placeholder="例如：英語一甲"></div><div><label>學號</label><input id="sid" placeholder="學號"></div><div><label>姓名</label><input id="sname" placeholder="姓名"></div></div><button id="start">開始練習</button><span id="bankInfo" class="muted"></span></div>
<div class="card hidden" id="practice"><div class="stats"><b id="step">1 / 5</b><b>完整度 <span id="comp">—</span></b><b>精準度 <span id="acc">—</span></b><b>辨識次數 <span id="tries">0</span></b></div><p class="sentence" id="sentence"></p><button id="speak">🔊 發音示範</button><button id="record" class="alt">🎙 開始錄音</button><button id="stop" class="alt" disabled>停止</button><label>辨識文字（可手動修正）</label><textarea id="heard"></textarea><button id="check">比對單字</button><button id="next" class="alt" disabled>下一句</button><div class="words" id="wordResult"></div><p id="summary" class="muted"></p><p class="muted">提醒：目前以語音辨識文字比對，不是音素層級聲學評分；Chrome／Edge 支援較佳。</p></div>
<div class="card hidden" id="finished"><h2>本回合完成</h2><p id="final"></p><p id="save"></p><button id="again">再練習一次</button></div></section>
<section id="teacher" class="hidden"><div class="card"><h1>教師管理</h1><label>教師 PIN</label><input id="pin" type="password"><button id="unlock">解鎖</button><span id="teacherMsg" class="muted"></span></div><div id="tools" class="hidden"><div class="card"><h2>題庫管理</h2><textarea id="newItems" placeholder="每行一個英文句子"></textarea><button id="add">新增題目</button><button id="refresh" class="alt">重新載入</button><div id="bankTable"></div></div><div class="card"><h2>TXT 匯入／匯出</h2><input type="file" id="txt" accept=".txt"><button id="import">匯入 TXT</button><button id="export" class="alt">匯出題庫</button></div><div class="card"><h2>成績查詢</h2><input id="filterClass" placeholder="班級（可空白）"><input id="filterId" placeholder="學號（可空白）"><button id="grades">查詢</button><div id="gradeTable"></div></div></div></section></main>
<script>
const API_URL="請填入_Google_Apps_Script_Web_App_URL";
const $=id=>document.getElementById(id);let bank=[],round=[],pos=0,records=[],rec=null,tries=0;
async function api(action,data){if(API_URL.startsWith("請填"))throw Error("尚未設定 Google Apps Script 網址，請先完成部署。");if(data){let r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action:action},data))});let j=await r.json();if(!j.ok)throw Error(j.error||"API error");return j;}let u=new URL(API_URL);u.searchParams.set("action",action);let j=await(await fetch(u)).json();if(!j.ok)throw Error(j.error||"API error");return j;}
function view(which){$("student").classList.toggle("hidden",which!=="student");$("teacher").classList.toggle("hidden",which!=="teacher");}
$("studentTab").onclick=()=>view("student");$("teacherTab").onclick=()=>view("teacher");
async function load(){try{let j=await api("getBank");bank=j.sentences||[];$("bankInfo").textContent="題庫 "+bank.length+" 句";}catch(e){$("bankInfo").textContent=e.message;}}load();
function tokens(s){return(s||"").toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9]+/g," ").trim().split(/\s+/).filter(Boolean);}
$("start").onclick=async()=>{if(!$("cls").value.trim()||!$("sid").value.trim()||!$("sname").value.trim())return alert("請填寫班級、學號與姓名");await load();if(bank.length<5)return alert("題庫至少需要 5 句，請教師先匯入");round=bank.slice().sort(()=>Math.random()-.5).slice(0,5);pos=0;records=[];tries=0;$("finished").classList.add("hidden");$("practice").classList.remove("hidden");render();};
function render(){$("sentence").textContent=round[pos].text;$("step").textContent=(pos+1)+" / 5";$("heard").value="";$("wordResult").innerHTML="";$("summary").textContent="";$("check").disabled=false;$("next").disabled=true;}
$("speak").onclick=()=>{let u=new SpeechSynthesisUtterance(round[pos].text);u.lang="en-US";u.rate=.88;speechSynthesis.cancel();speechSynthesis.speak(u);};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$("record").onclick=()=>{if(!SR)return alert("請使用 Chrome 或 Edge 語音辨識");rec=new SR();rec.lang="en-US";rec.continuous=true;rec.interimResults=true;rec.onresult=e=>{let s="";for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript+" ";$("heard").value=s.trim();};rec.onerror=e=>$("summary").textContent="辨識錯誤："+e.error;rec.onend=()=>{$("record").disabled=false;$("stop").disabled=true;};rec.start();$("record").disabled=true;$("stop").disabled=false;};
$("stop").onclick=()=>{if(rec)rec.stop();$("record").disabled=false;$("stop").disabled=true;};
$("check").onclick=()=>{if(rec)rec.stop();let target=tokens(round[pos].text),said=tokens($("heard").value);if(!said.length)return alert("請先錄音或輸入文字");let rem=said.slice(),out=[],correct=0,wrong=0,missed=0;target.forEach(w=>{let p=rem.indexOf(w);if(p>=0){rem.splice(p,1);out.push({w:w,c:"good"});correct++;}else if(rem.length){out.push({w:w,c:"bad",h:rem.shift()});wrong++;}else{out.push({w:w,c:"missed"});missed++;}});rem.forEach(w=>{out.push({w:w,c:"bad",h:w});wrong++;});let completeness=Math.round(correct/Math.max(1,target.length)*100),accuracy=Math.round(correct/Math.max(1,correct+wrong)*100);$("wordResult").innerHTML=out.map(x=>'<span class="word '+x.c+'">'+x.w+(x.h?' ← '+x.h:"")+'</span>').join("");$("summary").textContent="正確 "+correct+"｜錯誤 "+wrong+"｜漏唸 "+missed+"｜完整度 "+completeness+"%｜精準度 "+accuracy+"%";$("comp").textContent=completeness+"%";$("acc").textContent=accuracy+"%";tries++;$("tries").textContent=tries;$("check").disabled=true;$("next").disabled=false;records[pos]={sentence:round[pos].text,completeness:completeness,accuracy:accuracy,correct:correct,wrong:wrong,missed:missed,recognized:$("heard").value};};
$("next").onclick=async()=>{if(pos<4){pos++;render();return;}let c=Math.round(records.reduce((a,x)=>a+x.completeness,0)/5),a=Math.round(records.reduce((a,x)=>a+x.accuracy,0)/5);$("practice").classList.add("hidden");$("finished").classList.remove("hidden");$("final").textContent="平均完整度 "+c+"%，平均精準度 "+a+"%。";try{await api("saveResult",{className:$("cls").value,studentId:$("sid").value,studentName:$("sname").value,avgCompleteness:c,avgAccuracy:a,attempts:tries,details:records});$("save").textContent="成績已儲存";}catch(e){$("save").textContent="成績未儲存："+e.message;}};
$("again").onclick=()=>{$("finished").classList.add("hidden");$("practice").classList.add("hidden");};
$("unlock").onclick=async()=>{try{await api("teacherLogin",{pin:$("pin").value});$("tools").classList.remove("hidden");$("teacherMsg").textContent="驗證成功";await refreshBank();}catch(e){$("teacherMsg").textContent=e.message;}};
async function refreshBank(){let j=await api("getBank");bank=j.sentences||[];$("bankTable").innerHTML="<table><tr><th>題目</th><th>操作</th></tr>"+bank.map(s=>'<tr><td>'+escapeHtml(s.text)+'</td><td><button data-delete="'+escapeHtml(s.id)+'">刪除</button></td></tr>').join("")+"</table>";document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=async()=>{if(confirm("確定刪除？")){await api("deleteSentence",{pin:$("pin").value,id:b.dataset.delete});refreshBank();}});}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
$("add").onclick=async()=>{let a=$("newItems").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!a.length)return;await api("addSentences",{pin:$("pin").value,sentences:a});$("newItems").value="";await refreshBank();};
$("refresh").onclick=refreshBank;
$("import").onclick=async()=>{let f=$("txt").files[0];if(!f)return alert("請選擇 TXT 檔");let a=(await f.text()).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);await api("addSentences",{pin:$("pin").value,sentences:a});await refreshBank();alert("匯入 "+a.length+" 句完成");};
$("export").onclick=()=>{let blob=new Blob([bank.map(x=>x.text).join("\n")],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="pronunciation-bank.txt";a.click();URL.revokeObjectURL(a.href);};
$("grades").onclick=async()=>{try{let j=await api("getGrades",{pin:$("pin").value,className:$("filterClass").value,studentId:$("filterId").value});$("gradeTable").innerHTML="<table><tr><th>時間</th><th>班級</th><th>學號</th><th>姓名</th><th>完整度</th><th>精準度</th></tr>"+j.results.map(x=>"<tr><td>"+escapeHtml(x.timestamp)+"</td><td>"+escapeHtml(x.className)+"</td><td>"+escapeHtml(x.studentId)+"</td><td>"+escapeHtml(x.studentName)+"</td><td>"+x.avgCompleteness+"%</td><td>"+x.avgAccuracy+"%</td></tr>").join("")+"</table>";}catch(e){$("gradeTable").textContent=e.message;}};
</script></body></html>
